<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cost Estimator</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header>
    <h1>Manufacturing Cost</h1>
    <p>Factory, landed cost, fees, and margin—using 134 models and a 2,648-product reference catalog.</p>
  </header>

  <main>
    <section class="card">
      <div class="row between">
        <h2>Product</h2>
        <button id="capture">Capture page</button>
      </div>
      <label>Title<input id="title"/></label>
      <div class="grid2">
        <label>Retail price ($)<input id="retailPrice" type="number" min="0" step="0.01"/></label>
        <label>Category<select id="category"></select></label>
      </div>
      <label>Closest product archetype<select id="archetype"></select></label>
      <div class="grid2">
        <label>Quantity<input id="quantity" type="number" min="1" value="1000"/></label>
        <label>Confidence<select id="confidenceOverride">
          <option value="">Model default</option><option>High</option><option>Medium</option><option>Low</option>
        </select></label>
      </div>
    </section>

    <section class="card">
      <h2>Editable assumptions</h2>
      <div class="grid3">
        <label>Factory multiplier<input id="factoryMultiplier" type="number" value="1" step="0.05"/></label>
        <label>Packaging multiplier<input id="packagingMultiplier" type="number" value="1" step="0.05"/></label>
        <label>Freight multiplier<input id="freightMultiplier" type="number" value="1" step="0.05"/></label>
      </div>
      <div class="grid3">
        <label>Duty %<input id="dutyRate" type="number" value="5" step="0.1"/></label>
        <label>Marketplace fee %<input id="marketplaceRate" type="number" value="15" step="0.1"/></label>
        <label>Fulfillment / unit<input id="fulfillment" type="number" value="4.25" step="0.01"/></label>
      </div>
      <div class="grid2">
        <label>Returns allowance %<input id="returnsRate" type="number" value="5" step="0.1"/></label>
        <label>Other cost / unit<input id="otherCost" type="number" value="0" step="0.01"/></label>
      </div>
    </section>

    <section class="card results">
      <div class="row between"><h2>Estimate</h2><span id="confidence" class="pill">—</span></div>
      <div class="metric"><span>Factory cost</span><strong id="factoryResult">—</strong></div>
      <div class="metric"><span>Landed cost</span><strong id="landedResult">—</strong></div>
      <div class="metric"><span>Total selling cost</span><strong id="sellingCostResult">—</strong></div>
      <div class="metric"><span>Gross profit / unit</span><strong id="profitResult">—</strong></div>
      <div class="metric"><span>Gross margin</span><strong id="marginResult">—</strong></div>
      <p id="notes" class="notes"></p>
      <div class="row">
        <button id="calculate" class="primary">Calculate</button>
        <button id="export">Export CSV</button>
      </div>
    </section>
  </main>
<script src="sidepanel.js"></script>
</body>
</html>
