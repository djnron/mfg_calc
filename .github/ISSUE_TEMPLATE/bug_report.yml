name: Bug report
description: Report incorrect behavior in the extension, dataset, or calculator
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and the expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.2.0
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: product
    attributes:
      label: Product page or dataset row
      description: Remove private or confidential information.
